server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # The browser calls same-origin /api/...; nginx forwards it to the Go service
  # on the Docker network (the "backend" hostname only resolves inside Docker).
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    try_files $uri /index.html;
  }
}
