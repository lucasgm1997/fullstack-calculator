# Production override for a single VM (e.g. Oracle Cloud Always Free).
#
#   docker compose -f compose.yaml -f deploy/oracle/compose.prod.yaml up -d --build
#
# Only Caddy is exposed (80/443). The frontend (nginx) and backend are reachable
# only on the internal Docker network. Paths are relative to the repository root.
services:
  backend:
    ports: !reset []
    restart: always

  frontend:
    ports: !reset []
    restart: always

  caddy:
    image: caddy:2.10-alpine
    restart: always
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./deploy/oracle/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificates — keep this volume
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
