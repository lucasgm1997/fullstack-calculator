    <!-- Header -->
    <header class="flex items-center justify-between">
      <div class="flex items-center gap-3 rounded-pill bg-surface py-1.5 pr-4 pl-1.5">
        <span class="grid size-9 place-items-center rounded-full bg-brand-500 font-medium text-white">C</span>
        <div class="leading-tight">
          <p class="text-sm font-medium text-fg-strong">Calculator</p>
          <p class="flex items-center gap-1 text-caption text-fg-muted">
            <span id="api-dot" class="size-2 rounded-full bg-mint"></span>
            <span id="api-status">API online</span>
          </p>
        </div>
      </div>
      <button id="mode-toggle" class="btn-ghost h-9 px-4 text-caption" aria-pressed="false">Advanced</button>
    </header>

    <!-- Display -->
    <section id="display" class="card flex min-h-40 flex-col justify-end gap-1 p-5 text-right transition-colors" aria-live="polite">
      <p id="expr" class="min-h-6 truncate text-body text-fg-muted tabular-nums">&nbsp;</p>
      <p id="result" class="truncate text-display text-fg-strong tabular-nums">0</p>
      <p id="error" class="hidden text-sm font-medium text-danger"></p>
    </section>

    <!-- Advanced row -->
    <div id="advanced" class="hidden grid-cols-3 gap-3">
      <button data-op="power" class="key key-op">x<sup>y</sup></button>
      <button data-op="sqrt"  class="key key-op">√x</button>
      <button data-op="percentage" class="key key-op">x% of y</button>
    </div>

    <!-- Keypad -->
    <div class="grid grid-cols-4 gap-3" id="keypad">
      <button data-action="clear"  class="key key-fn">AC</button>
      <button data-action="back"   class="key key-fn" aria-label="Backspace">⌫</button>
      <button data-action="sign"   class="key key-fn">±</button>
      <button data-op="divide"     class="key key-op">÷</button>

      <button data-digit="7" class="key">7</button>
      <button data-digit="8" class="key">8</button>
      <button data-digit="9" class="key">9</button>
      <button data-op="multiply" class="key key-op">×</button>

      <button data-digit="4" class="key">4</button>
      <button data-digit="5" class="key">5</button>
      <button data-digit="6" class="key">6</button>
      <button data-op="subtract" class="key key-op">−</button>

      <button data-digit="1" class="key">1</button>
      <button data-digit="2" class="key">2</button>
      <button data-digit="3" class="key">3</button>
      <button data-op="add" class="key key-op">+</button>

      <button data-digit="0" class="key col-span-2 justify-start pl-7">0</button>
      <button data-digit="." class="key">.</button>
      <button data-action="equals" id="equals" class="key bg-mint text-mint-fg hover:bg-mint-strong">=</button>
    </div>

    <!-- API inspector -->
    <details class="card group p-4" open>
      <summary class="flex cursor-pointer list-none items-center justify-between text-label text-fg-muted uppercase">
        Last API call
        <span class="text-fg-subtle transition-transform group-open:rotate-180">⌄</span>
      </summary>
      <div class="mt-3 space-y-2">
        <p class="text-caption text-fg-subtle">Request</p>
        <pre id="req" class="overflow-x-auto rounded-lg bg-bg-deep p-3 text-caption text-fg">—</pre>
        <p class="flex items-center gap-2 text-caption text-fg-subtle">Response <span id="status-badge" class="hidden rounded-xs px-1.5 py-0.5 text-[11px] font-semibold"></span></p>
        <pre id="res" class="overflow-x-auto rounded-lg bg-bg-deep p-3 text-caption text-fg">—</pre>
      </div>
    </details>

    <!-- History -->
    <section class="space-y-2">
      <div class="flex items-center justify-between">
        <h2 class="text-lead text-fg-strong">History</h2>
        <button id="clear-history" class="text-sm text-fg-muted hover:text-fg">Clear</button>
      </div>
      <ul id="history" class="space-y-2">
        <li class="rounded-xl border border-dashed border-line p-4 text-center text-sm text-fg-subtle">No calculations yet</li>
      </ul>
    </section>
  </main>

  <!-- Bottom nav (app feel) -->
  <nav class="fixed inset-x-0 bottom-0 border-t border-line-faint bg-bg-deep/95 backdrop-blur">
    <ul class="mx-auto grid max-w-md grid-cols-3 py-2 text-caption">
      <li class="flex flex-col items-center gap-0.5 text-brand-300"><span class="text-xl">▦</span>Calculator</li>
      <li class="flex flex-col items-center gap-0.5 text-fg-muted"><span class="text-xl">↺</span>History</li>
      <li class="flex flex-col items-center gap-0.5 text-fg-muted"><span class="text-xl">{ }</span>API</li>
    </ul>
  </nav>

  <!-- hidden: force-generate state classes -->
  <div class="hidden border-danger bg-danger/15 text-danger bg-mint/15 text-mint opacity-60 ring-2 ring-brand-400 grid"></div>

<script>
// ---------- Mock of the Go REST API: POST /api/v1/calculate ----------
const OPS = {
  add:        { sym: '+',  arity: 2, fn: (a, b) => a + b },
  subtract:   { sym: '−',  arity: 2, fn: (a, b) => a - b },
  multiply:   { sym: '×',  arity: 2, fn: (a, b) => a * b },
  divide:     { sym: '÷',  arity: 2, fn: (a, b) => a / b },
  power:      { sym: '^',  arity: 2, fn: (a, b) => a ** b },
  sqrt:       { sym: '√',  arity: 1, fn: (a) => Math.sqrt(a) },
  percentage: { sym: '% of', arity: 2, fn: (a, b) => (a / 100) * b },
};

async function mockApi(body) {
  await new Promise(r => setTimeout(r, 250));
  const err = (status, code, message) => ({ status, json: { error: { code, message } } });
  const op = OPS[body.operation];
  if (!op) return err(400, 'INVALID_OPERATION', `unsupported operation "${body.operation}"`);
  if (typeof body.a !== 'number' || !Number.isFinite(body.a)) return err(400, 'INVALID_INPUT', 'field "a" must be a finite number');
  if (op.arity === 2 && (typeof body.b !== 'number' || !Number.isFinite(body.b))) return err(400, 'INVALID_INPUT', 'field "b" must be a finite number');
  if (body.operation === 'divide' && body.b === 0) return err(422, 'DIVISION_BY_ZERO', 'division by zero is not allowed');
  if (body.operation === 'sqrt' && body.a < 0) return err(422, 'NEGATIVE_SQRT', 'square root of a negative number is not allowed');
  const result = op.fn(body.a, body.b);
  if (!Number.isFinite(result)) return err(422, 'OVERFLOW', 'result is out of range');
  return { status: 200, json: { operation: body.operation, a: body.a, ...(op.arity === 2 && { b: body.b }), result } };
}

// ---------- UI state ----------
const $ = id => document.getElementById(id);
const state = { a: null, op: null, input: '0', fresh: true, loading: false, history: [] };
const fmt = n => Number.isInteger(n) ? n.toLocaleString('en-US') : Number(n.toPrecision(12)).toLocaleString('en-US', { maximumFractionDigits: 10 });

function setError(msg) {
  $('error').textContent = msg || '';
  $('error').classList.toggle('hidden', !msg);
  $('display').classList.toggle('border-danger', !!msg);
}

function render() {
  const op = state.op && OPS[state.op];
  $('expr').innerHTML = op ? `${fmt(state.a)} ${op.sym}` : '&nbsp;';
  $('result').textContent = state.input === '-' ? '-' : (state.input.endsWith('.') ? state.input : fmt(Number(state.input)));
  document.querySelectorAll('[data-op]').forEach(b =>
    b.classList.toggle('ring-2', b.dataset.op === state.op));
  document.querySelectorAll('[data-op]').forEach(b => b.classList.toggle('ring-brand-400', b.dataset.op === state.op));
}

function digit(d) {
  setError();
  if (state.fresh) { state.input = d === '.' ? '0.' : d; state.fresh = false; }
  else if (d === '.' && state.input.includes('.')) return;              // validation: one decimal point
  else if (state.input.replace(/[-.]/g, '').length >= 12) return;       // validation: max 12 digits
  else state.input = state.input === '0' && d !== '.' ? d : state.input + d;
  render();
}

async function call(operation, a, b) {
  const body = { operation, a, ...(b !== undefined && { b }) };
  $('req').textContent = `POST /api/v1/calculate\n${JSON.stringify(body, null, 2)}`;
  state.loading = true; $('equals').classList.add('opacity-60'); $('equals').textContent = '…';
  const { status, json } = await mockApi(body);
  state.loading = false; $('equals').classList.remove('opacity-60'); $('equals').textContent = '=';
  $('res').textContent = JSON.stringify(json, null, 2);
  const badge = $('status-badge');
  badge.textContent = status; badge.classList.remove('hidden');
  badge.className = `rounded-xs px-1.5 py-0.5 text-[11px] font-semibold ${status === 200 ? 'bg-mint/15 text-mint' : 'bg-danger/15 text-danger'}`;
  if (status !== 200) { setError(json.error.message); return null; }
  const op = OPS[operation];
  addHistory(op.arity === 2 ? `${fmt(a)} ${op.sym} ${fmt(b)}` : `√${fmt(a)}`, json.result);
  return json.result;
}

async function chooseOp(op) {
  if (state.loading) return;
  setError();
  const current = Number(state.input);
  if (OPS[op].arity === 1) {
    const r = await call(op, current);
    if (r !== null) { state.input = String(r); state.fresh = true; state.op = null; }
    return render();
  }
  if (state.op && !state.fresh) {                     // chain: 2 + 3 × → compute 2+3 first
    const r = await call(state.op, state.a, current);
    if (r === null) return render();
    state.a = r; state.input = String(r);
  } else state.a = current;
  state.op = op; state.fresh = true;
  render();
}

async function equals() {
  if (state.loading || !state.op) return;
  if (state.fresh) { setError('Enter a second number'); return; }  // validation
  const r = await call(state.op, state.a, Number(state.input));
  if (r !== null) { state.input = String(r); state.op = null; state.a = null; state.fresh = true; }
  render();
}

function addHistory(expr, result) {
  state.history.unshift({ expr, result });
  $('history').innerHTML = state.history.slice(0, 6).map(h => `
    <li class="flex items-center justify-between rounded-xl bg-surface px-4 py-3">
      <span class="text-sm text-fg-muted tabular-nums">${h.expr}</span>
      <span class="font-medium text-fg-strong tabular-nums">= ${fmt(h.result)}</span>
    </li>`).join('');
}

// ---------- Events ----------
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.digit) digit(b.dataset.digit);
  else if (b.dataset.op) chooseOp(b.dataset.op);
  else if (b.dataset.action === 'equals') equals();
  else if (b.dataset.action === 'clear') { Object.assign(state, { a: null, op: null, input: '0', fresh: true }); setError(); render(); }
  else if (b.dataset.action === 'back') { state.input = state.input.length > 1 ? state.input.slice(0, -1) : '0'; render(); }
  else if (b.dataset.action === 'sign') { state.input = state.input.startsWith('-') ? state.input.slice(1) : (state.input === '0' ? '0' : '-' + state.input); render(); }
});
$('mode-toggle').addEventListener('click', e => {
  const on = $('advanced').classList.toggle('hidden') === false;
  $('advanced').classList.toggle('grid', on);
  e.currentTarget.setAttribute('aria-pressed', on);
  e.currentTarget.textContent = on ? 'Basic' : 'Advanced';
});
$('clear-history').addEventListener('click', () => { state.history = []; $('history').innerHTML = '<li class="rounded-xl border border-dashed border-line p-4 text-center text-sm text-fg-subtle">No calculations yet</li>'; });
document.addEventListener('keydown', e => {
  const map = { '+': 'add', '-': 'subtract', '*': 'multiply', '/': 'divide', '^': 'power' };
  if (/^[0-9.]$/.test(e.key)) digit(e.key);
  else if (map[e.key]) chooseOp(map[e.key]);
  else if (e.key === 'Enter' || e.key === '=') { e.preventDefault(); equals(); }
  else if (e.key === 'Backspace') document.querySelector('[data-action=back]').click();
  else if (e.key === 'Escape') document.querySelector('[data-action=clear]').click();
});
render();
</script>
</body>
</html>
